[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compression-challenge-codecs"
version = "0.1.0"
description = "Custom numcodecs codecs used for the compression-lab challenge submissions"
requires-python = ">=3.11"
dependencies = ["numpy", "numba", "numcodecs", "scipy", "numcodecs-combinators", "numcodecs-clip", "numcodecs-chunked", "numcodecs-grid-int", "numcodecs-eb-quantize", "numcodecs-context-mixing", "numcodecs-interp-ctx", "numcodecs-lon-gradient", "numcodecs-abs-or-rel", "numcodecs-replace", "numcodecs-zero", "numcodecs-mask", "numcodecs-pw-ratio"]

[tool.setuptools]
py-modules = []

# Git pins for features from open upstream PRs (drop once merged and released):
# - numcodecs-mask: mask-aware codec protocol (juntyr/numcodecs-mask#4)
# - numcodecs-pw-ratio: pack_signs (juntyr/numcodecs-pw-ratio#1), used by the
#   pressure d and vo configurations (boolean sign plane + context_mixing.bitmap)
[tool.uv.sources]
numcodecs-mask = { git = "https://github.com/SF-N/numcodecs-mask", branch = "mask-aware-codecs" }
numcodecs-pw-ratio = { git = "https://github.com/SF-N/numcodecs-pw-ratio", branch = "abs-or-rel-and-sign-plane" }
