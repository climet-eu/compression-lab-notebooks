name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

env:
  CLICOLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Spellcheck repo
        uses: crate-ci/typos@v1

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --diff --check"

  citation:
    name: Citation Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5

      - name: Validate .zenodo.json
        uses: vsoch/zenodo-validator@00643f085e550b329ab56bc79da510ba18b2d547

  links:
    name: Check Hyperlinks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Jupyter Book
        run: uv sync --group book

      - name: Check hyperlinks
        run: uv run jupyter-book build --ci --check-links --strict
